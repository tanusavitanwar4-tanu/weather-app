<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Forecasting App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="weather-card">
        <h1>Weather App</h1>
        <div class="search-box">
            <input type="text" id="cityInput" placeholder="Enter city name..." autocomplete="off">
            <button id="searchBtn">🔍</button>
        </div>
        
        <div class="weather-info" id="weatherInfo" style="display: none;">
            <h2 id="cityName">--</h2>
            <p id="temp">--°C</p>
            <p id="condition">--</p>
            <div class="details">
                <span>Humidity: <strong id="humidity">--%</strong></span>
                <span>Wind: <strong id="windSpeed">-- km/h</strong></span>
            </div>
        </div>
        <p id="errorMsg" class="error" style="display: none;">City not found! Please try again.</p>
    </div>

    <script src="script.js"></script>
</body>
</html>
